<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Discount Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .calculator {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }
        .results.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .result-label {
            color: #555;
            font-size: 1rem;
        }
        .result-value {
            font-weight: 700;
            font-size: 1.1rem;
            color: #333;
        }
        .discount-value {
            color: #27ae60;
            font-size: 1.3rem;
        }
        .final-value {
            color: #667eea;
            font-size: 1.3rem;
        }
        .divider {
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 15px 0;
            border-radius: 1px;
        }
        .formula {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 10px;
            color: #856404;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>🏷️ Discount Calculator</h1>
        <p class="subtitle">Enter your shopping amount to calculate discount</p>
        
        <div class="input-group">
            <label for="amount">Shopping Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g., 10000" min="0" step="100">
        </div>
        
        <button class="btn" onclick="calculateDiscount()">Calculate Discount</button>
        
        <div class="results" id="results">
            <div class="result-row">
                <span class="result-label">Shopping Amount</span>
                <span class="result-value" id="displayAmount">₹0</span>
            </div>
            <div class="result-row">
                <span class="result-label">Discount Applied</span>
                <span class="result-value discount-value" id="displayDiscount">₹0</span>
            </div>
            <div class="divider"></div>
            <div class="result-row">
                <span class="result-label">Final Amount</span>
                <span class="result-value final-value" id="displayFinal">₹0</span>
            </div>
            <div class="formula">
                💡 Formula: Discount = Amount × 1% (₹100 per ₹10,000)
            </div>
        </div>
    </div>

    <script>
        function calculateDiscount() {
            const amountInput = document.getElementById('amount');
            const amount = parseFloat(amountInput.value);
            
            if (isNaN(amount) || amount < 0) {
                alert('Please enter a valid amount');
                amountInput.focus();
                return;
            }
            
            const discount = Math.floor(amount / 100);
            const finalAmount = amount - discount;
            
            document.getElementById('displayAmount').textContent = formatCurrency(amount);
            document.getElementById('displayDiscount').textContent = formatCurrency(discount);
            document.getElementById('displayFinal').textContent = formatCurrency(finalAmount);
            
            document.getElementById('results').classList.add('show');
        }
        
        function formatCurrency(value) {
            return '₹' + value.toLocaleString('en-IN');
        }
        
        document.getElementById('amount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateDiscount();
            }
        });
    </script>
</body>
</html>
